<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairySpecial</title>
  <style>
    body { margin:0; font-family:system-ui,Segoe UI,Helvetica,Arial; background:#000; color:#ccc; user-select:none; -webkit-user-select:none; }
    #fullMap, #stitchedWrap, canvas { 
      will-change: transform; 
      backface-visibility: hidden; 
      transform: translateZ(0); 
    }
    img { -webkit-user-drag:none; user-drag:none; }

    /* Fairy ring tier list (Rank fairy rings) popup */
    #rankTierList { font-family:system-ui,Segoe UI,Arial; }
    .rank-tier { display:flex; align-items:stretch; gap:10px; }
    .rank-tier-label { width:56px; min-width:56px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:24px; font-weight:bold; color:#111; }
    .rank-tier[data-tier="S"] .rank-tier-label { background:#ff7b72; }
    .rank-tier[data-tier="A"] .rank-tier-label { background:#f0a45c; }
    .rank-tier[data-tier="B"] .rank-tier-label { background:#f7d154; }
    .rank-tier[data-tier="C"] .rank-tier-label { background:#a6d96a; }
    .rank-tier[data-tier="D"] .rank-tier-label { background:#7fb2e0; }
    .rank-tier[data-tier="E"] .rank-tier-label { background:#b39ddb; }
    .rank-tier[data-tier="F"] .rank-tier-label { background:#a855f7; }
    .rank-pool .rank-tier-label { background:#3a3a4a; color:#ddd; font-size:14px; }
    .rank-tier-zone { --tile-size:110px; flex:1; min-width:0; min-height:var(--tile-size); display:grid; grid-template-columns:repeat(7, 1fr); grid-auto-rows:var(--tile-size); gap:8px; padding:8px; align-content:start; border:1px dashed rgba(255,255,255,0.25); border-radius:10px; background:rgba(255,255,255,0.03); }
    .rank-tier-zone.drag-over { border-color:#f0c040; background:rgba(240,192,64,0.08); }
    .rank-tile { position:relative; width:100%; height:100%; border:2px solid rgba(255,255,255,0.35); border-radius:8px; overflow:hidden; box-sizing:border-box; cursor:grab; }
    .rank-tile.dragging { opacity:0.4; border-style:dashed; }
    .rank-tile-badge { position:absolute; left:2px; right:2px; top:2px; text-align:center; background:rgba(0,0,0,0.85); border:1px solid rgba(0,229,255,0.55); border-radius:4px; color:#00e5ff; font-weight:bold; font-size:12px; letter-spacing:1px; padding:1px 2px; line-height:1.15; font-family:Arial,sans-serif; }
    .rank-tile-badge.clickable { cursor:pointer; }
    .rank-tile-badge.clickable:hover { border-color:#f0c040; color:#fff; }
  </style>
</head>
<body>

  <div id="fullMap" style="display:block; overflow:hidden; border:1px solid #222; position:fixed; left:0; top:0; right:0; bottom:0; background:#000;">
    <div id="stitchedWrap" style="position:relative; display:block; transform-origin: 0 0;">
      <img id="stitchedImg" src="static/map_stitched.png" alt="Full map" draggable="false" style="display:block; image-rendering:auto;" />
      <canvas id="gridCanvas" style="position:absolute; left:0; top:0; pointer-events:none;"></canvas>
    </div>
    <div id="zoomControls" style="position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; flex-direction:row; gap:0; z-index:100000; align-items:center;">
      <button id="zoomOutBtn" title="Zoom out" style="width:48px;height:48px;font-size:26px;font-weight:bold;border:2px solid rgba(255,255,255,0.45);border-right:0;border-radius:8px;background:rgba(30,30,30,0.85);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background 0.15s;">&minus;</button>
      <button id="zoomInBtn" title="Zoom in" style="width:48px;height:48px;font-size:26px;font-weight:bold;border:2px solid rgba(255,255,255,0.45);border-left:0;border-radius:8px;background:rgba(30,30,30,0.85);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background 0.15s;">+</button>
      <button id="undergroundBtn" title="Show underground fairy rings" style="height:48px;padding:0 16px;font-size:18px;font-weight:bold;border:2px solid rgba(255,255,255,0.45);border-radius:8px;margin-left:32px;margin-right:32px;background:rgba(30,30,30,0.85);color:#00e5ff;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background 0.15s;white-space:nowrap;">Show underground fairy rings</button>
      <button id="rankBtn" title="Fairy ring tier list" style="height:48px;padding:0 16px;font-size:18px;font-weight:bold;border:2px solid rgba(255,255,255,0.45);border-radius:8px;background:rgba(30,30,30,0.85);color:#ffd700;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);transition:background 0.15s;white-space:nowrap;">Fairy ring tier list</button>
    </div>
    <!-- Invisible chunk-identify button, moved to the top-right corner, separate from the toolbar -->
    <button id="identifyBtn" style="position:fixed; top:10px; right:10px; width:32px; height:48px; z-index:100000; border:none; background:transparent; opacity:0; cursor:pointer;"></button>
  </div>

  <!-- Underground / instance fairy rings popup -->
  <div id="undergroundPopup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:100001; align-items:center; justify-content:center;">
    <div style="background:#151528; border:1px solid #4a9eff; border-radius:12px; padding:18px 20px; max-width:740px; width:92%; max-height:92vh; overflow-y:auto; position:relative; box-shadow:0 12px 50px rgba(0,0,0,0.7);">
      <button id="undergroundPopupClose" title="Close" style="position:absolute; top:10px; right:12px; width:36px; height:36px; font-size:18px; font-weight:bold; border:none; border-radius:8px; background:rgba(255,255,255,0.08); color:#ccc; cursor:pointer;">✕</button>
      <h2 style="margin:0 0 14px; color:#e8e8e8; font-size:32px; font-weight:bold; text-align:center; font-family:system-ui,Segoe UI,Arial;">Underground / Instance fairy rings</h2>
      <div id="undergroundPopupGrid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;"></div>
    </div>
  </div>

  <!-- Fairy ring tier list popup -->
  <div id="rankPopup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:100001; align-items:center; justify-content:center;">
    <div style="background:#151528; border:1px solid #f0c040; border-radius:12px; padding:18px 20px; max-width:920px; width:94%; max-height:92vh; overflow-y:auto; position:relative; box-shadow:0 12px 50px rgba(0,0,0,0.7);">
      <button id="rankResetBtn" title="Reset all rankings (move every ring back to the pool)" style="position:absolute; top:10px; right:56px; width:36px; height:36px; border:none; border-radius:8px; background:rgba(255,255,255,0.08); color:#ccc; cursor:pointer; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
      <button id="rankPopupClose" title="Close" style="position:absolute; top:10px; right:12px; width:36px; height:36px; font-size:18px; font-weight:bold; border:none; border-radius:8px; background:rgba(255,255,255,0.08); color:#ccc; cursor:pointer;">✕</button>
      <h2 style="margin:0 0 14px; color:#e8e8e8; font-size:42px; font-weight:bold; text-align:center; font-family:system-ui,Segoe UI,Arial;">Fairy ring tier list</h2>
      <div id="rankTierList" style="display:flex; flex-direction:column; gap:8px;"></div>
      <div id="rankResetConfirm" style="display:none; position:absolute; inset:0; background:rgba(0,0,0,0.6); border-radius:12px; z-index:2; align-items:center; justify-content:center;">
        <div style="background:#151528; border:1px solid #f0c040; border-radius:12px; padding:24px 30px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,0.6);">
          <div style="color:#e8e8e8; font-size:18px; font-weight:bold; margin-bottom:18px; font-family:system-ui,Segoe UI,Arial;">Are you sure you want to reset?</div>
          <div style="display:flex; gap:12px; justify-content:center;">
            <button id="rankResetConfirmYes" style="height:36px; padding:0 18px; font-size:14px; font-weight:bold; border:2px solid rgba(255,255,255,0.45); border-radius:8px; background:rgba(30,30,30,0.85); color:#e8e8e8; cursor:pointer;">Yes, reset</button>
            <button id="rankResetConfirmNo" style="height:36px; padding:0 18px; font-size:14px; font-weight:bold; border:2px solid rgba(255,255,255,0.45); border-radius:8px; background:rgba(30,30,30,0.85); color:#e8e8e8; cursor:pointer;">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Manual positioning popup (normal-map fairy ring chunks) -->
  <div id="alignPopup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:100002; align-items:center; justify-content:center;">
    <div style="background:#151528; border:1px solid #f0c040; border-radius:12px; padding:18px 20px; max-width:600px; width:92%; position:relative; box-shadow:0 12px 50px rgba(0,0,0,0.7);">
      <button id="alignPopupClose" title="Close" style="position:absolute; top:10px; right:12px; width:36px; height:36px; font-size:18px; font-weight:bold; border:none; border-radius:8px; background:rgba(255,255,255,0.08); color:#ccc; cursor:pointer;">✕</button>
      <h2 id="alignPopupTitle" style="margin:0 0 4px; color:#e8e8e8; font-size:26px; font-weight:bold; text-align:center; font-family:system-ui,Segoe UI,Arial;">Position fairy ring chunk</h2>
      <p style="margin:0 0 12px; text-align:center; color:#999; font-size:13px; font-family:system-ui,Segoe UI,Arial;">Scroll or use the buttons to zoom, drag to position the map. Close the popup to use this view in the tier list.</p>
      <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin:0 0 10px;">
        <button id="alignZoomOutBtn" title="Zoom out" style="width:46px;height:40px;font-size:22px;font-weight:bold;border:none;border-radius:8px;background:rgba(255,255,255,0.08);color:#e8e8e8;cursor:pointer;">&minus;</button>
        <button id="alignZoomInBtn" title="Zoom in" style="width:46px;height:40px;font-size:22px;font-weight:bold;border:none;border-radius:8px;background:rgba(255,255,255,0.08);color:#e8e8e8;cursor:pointer;">+</button>
        <span id="alignZoomLabel" style="color:#999;font-size:14px;min-width:56px;text-align:center;font-family:system-ui,Segoe UI,Arial;">130%</span>
        <button id="alignCenterBtn" title="Center the fairy ring in the image" style="height:40px;padding:0 12px;font-size:13px;font-weight:bold;border:none;border-radius:8px;background:rgba(74,158,255,0.25);color:#9fc6ff;cursor:pointer;">Center on ring</button>
      </div>
      <div id="alignViewport" style="width:100%; aspect-ratio:1/1; border:2px solid #4a9eff; border-radius:10px; overflow:hidden; background:#0a0a12; cursor:grab; touch-action:none;"></div>
    </div>
  </div>

  <script src="static/index.js?v=4"></script>
  <script>
    const stitched = document.getElementById('stitchedImg');
    const fullMap = document.getElementById('fullMap');
    const stitchedWrap = document.getElementById('stitchedWrap');
    const canvas = document.getElementById('gridCanvas');

    let manifest = null;
    let currentScale = 1, currentTX = 0, currentTY = 0;
    let baseTileW = 256, baseTileH = 256;
    let minScale = 0.3, maxScale = 6;

    // ===== HD world map calibration =====
    // map_stitched.png is the HD map resized to 11776x7936 (46x31 chunks of 256px).
    // The HD world is slightly compressed vs the standard grid. Fitted affine from
    // sea-mask template matching: x_hd = 0.9584*x + 245.2 , y_hd = 0.9419*y + 231.2
    // (full stitched px) -> columns scale 95.84%, rows 91.25%, plus a positive nudge.
    const DEFAULT_GRID_NUDGE = { x: 245, y: 231 };
    const DEFAULT_ROW_SCALE_PERCENT = 91.25;
    const DEFAULT_COL_SCALE_PERCENT = 95.84;
    const DEFAULT_CENTER_ROW = 14; // startup center: chunk (14,33) — roughly Draynor / south coast
    const DEFAULT_CENTER_COL = 33;
    // Startup zoom: show roughly a 10x7 chunk band centered on the chunk above (like the pasted screenshot)
    // instead of fitting the entire map on screen.
    const START_SPAN_COLS = 10;
    const START_SPAN_ROWS = 7;
    const UNDERGROUND_PAD = 0; // underground row removed — replaced by the popup button

    function setupCanvas() {
      if (!stitched || !stitched.naturalWidth) return;
      if (!manifest || !Array.isArray(manifest.chunks) || manifest.chunks.length === 0) return;
      try { canvas.width = stitched.naturalWidth; canvas.height = stitched.naturalHeight + UNDERGROUND_PAD; } catch(e) {}
      try { canvas.style.width = stitched.naturalWidth + 'px'; canvas.style.height = (stitched.naturalHeight + UNDERGROUND_PAD) + 'px'; } catch(e) {}
      try { const first = manifest.chunks[0]; if (first) { baseTileW = first.bbox[2] - first.bbox[0]; baseTileH = first.bbox[3] - first.bbox[1]; } } catch(e) {}
      try { if (stitched) { stitched.style.display = 'block'; stitched.style.opacity = '1'; } } catch(e) {}

      try {
        window._gridInfo = { colLefts: [], colWidths: [], rowTops: [], rowHeights: [] };
        const gi = window._gridInfo;
        for (let c = 0; c < manifest.cols; c++) {
          const chunk = manifest.chunks.find(ch => ch.row === 0 && ch.col === c);
          if (chunk) { gi.colLefts.push(chunk.bbox[0]); gi.colWidths.push(chunk.bbox[2] - chunk.bbox[0]); }
          else { gi.colLefts.push(c * baseTileW); gi.colWidths.push(baseTileW); }
        }
        for (let r = 0; r < manifest.rows; r++) {
          const chunk = manifest.chunks.find(ch => ch.col === 0 && ch.row === r);
          if (chunk) { gi.rowTops.push(chunk.bbox[1]); gi.rowHeights.push(chunk.bbox[3] - chunk.bbox[1]); }
          else { gi.rowTops.push(r * baseTileH); gi.rowHeights.push(baseTileH); }
        }
        try {
          const scale = DEFAULT_ROW_SCALE_PERCENT / 100.0;
          if (Math.abs(scale - 1.0) > 1e-6) {
            const newHeights = gi.rowHeights.map(h => Math.max(1, h * scale));
            const firstTop = gi.rowTops[0] || 0;
            gi.rowHeights = newHeights;
            gi.rowTops = [];
            let acc = firstTop;
            for (let r = 0; r < newHeights.length; r++) { gi.rowTops.push(acc); acc += newHeights[r]; }
          }
        } catch(e) {}
        try {
          const colScale = DEFAULT_COL_SCALE_PERCENT / 100.0;
          if (Math.abs(colScale - 1.0) > 1e-6) {
            const newWidths = gi.colWidths.map(w => Math.max(1, w * colScale));
            const firstLeft = gi.colLefts[0] || 0;
            gi.colWidths = newWidths;
            gi.colLefts = [];
            let acc = firstLeft;
            for (let c = 0; c < newWidths.length; c++) { gi.colLefts.push(acc); acc += newWidths[c]; }
          }
        } catch(e) {}
        try {
          let nudgeX = DEFAULT_GRID_NUDGE.x, nudgeY = DEFAULT_GRID_NUDGE.y;
          if (nudgeX !== 0) for (let i = 0; i < gi.colLefts.length; i++) gi.colLefts[i] += nudgeX;
          if (nudgeY !== 0) for (let i = 0; i < gi.rowTops.length; i++) gi.rowTops[i] += nudgeY;
          if (gi.colLefts.length > 0 && gi.colLefts[0] < 0) { const corr = -Math.round(gi.colLefts[0]); for (let i = 0; i < gi.colLefts.length; i++) gi.colLefts[i] += corr; }
          if (gi.rowTops.length > 0 && gi.rowTops[0] < 0) { const corr = -Math.round(gi.rowTops[0]); for (let i = 0; i < gi.rowTops.length; i++) gi.rowTops[i] += corr; }
        } catch(e) {}
      } catch(e) { window._gridInfo = null; }
    }

    function applyTransform() {
      if (!stitchedWrap) return;
      stitchedWrap.style.transform = `translate(${currentTX}px, ${currentTY}px) scale(${currentScale})`;
      stitchedWrap.style.transformOrigin = '0 0';
      // NOTE: The canvas content is static and moves along with the wrapper transform,
      // so we deliberately do NOT redraw the grid here. Redrawing the 11776x8276 canvas
      // on every mousemove caused the heavy lag while dragging/zooming.
    }

    function drawGrid() {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const gi = window._gridInfo;
      if (!gi || !manifest) return;
      
      // Draw gray overlay on non-fairy-ring chunks
      drawGrayOverlay(ctx, gi);
      
      const gridBottom = gi.rowTops[gi.rowTops.length - 1] + gi.rowHeights[gi.rowHeights.length - 1];
      
      // Default chunk grid: dark gray (user asked gray borders instead of black, then dark gray), slightly thicker than before
      ctx.strokeStyle = 'rgba(55,55,55,0.9)'; // 25% darker gray (73 -> 55)
      ctx.lineWidth = 3;
      // Row lines
      for (let r = 0; r <= manifest.rows; r++) {
        const y = r < gi.rowTops.length ? gi.rowTops[r] : (gi.rowTops[gi.rowTops.length - 1] + gi.rowHeights[gi.rowHeights.length - 1]);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      // Column lines - stop at grid bottom
      for (let c = 0; c <= manifest.cols; c++) {
        const x = c < gi.colLefts.length ? gi.colLefts[c] : (gi.colLefts[gi.colLefts.length - 1] + gi.colWidths[gi.colWidths.length - 1]);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gridBottom); ctx.stroke();
      }
      // Green border around every chunk that contains a fairy ring (slightly thicker than the grid)
      ctx.strokeStyle = 'rgba(46,204,113,1)';
      ctx.lineWidth = 5.9895; // another +10%: 5.445 -> 5.9895 (was 4.5 originally)
      for (const key of Object.keys(FAIRY_CHUNKS)) {
        const [r, c] = key.split(',').map(Number);
        if (r >= gi.rowTops.length || c >= gi.colLefts.length) continue;
        ctx.strokeRect(gi.colLefts[c], gi.rowTops[r], gi.colWidths[c], gi.rowHeights[r]);
      }
      drawFairyRingChunkLabels(ctx, gi);
    }

    // Gray overlay for non-fairy-ring chunks
    function drawGrayOverlay(ctx, gi) {
      if (!gi || !manifest) return;
      const fairySet = new Set(Object.keys(FAIRY_CHUNKS));
      for (let r = 0; r < manifest.rows; r++) {
        for (let c = 0; c < manifest.cols; c++) {
          if (fairySet.has(`${r},${c}`)) continue;
          const x = gi.colLefts[c];
          const y = gi.rowTops[r];
          const w = gi.colWidths[c];
          const h = gi.rowHeights[r];
          ctx.fillStyle = 'rgba(0,0,0,0.749)'; // black overlay, 25% darker opacity (0.599 -> 0.749)
          ctx.fillRect(x, y, w, h);
        }
      }
    }

    // Underground row with proper boxes and Fairy Resistance Hideout
    const UNDERGROUND_RINGS = [
      'ALR','BKS','BLP','DIP','DLP','AJQ','BJR','BKQ','CKP','DIQ','DIR','DLS','BLQ'
    ];

    function drawUndergroundRow(ctx, gi) {
      if (!gi || !manifest) return;
      const cols = manifest.cols;
      const colW = gi.colLefts.length > 0 ? gi.colWidths[0] : baseTileW;
      const chunkH = gi.rowHeights.length > 0 ? gi.rowHeights[0] : baseTileH;
      const gridBottom = gi.rowTops[gi.rowTops.length - 1] + gi.rowHeights[gi.rowHeights.length - 1];
      const sepY = gridBottom + 4;
      const titleGap = 55; // space between title and boxes (~5cm on screen)
      const topY = sepY + 24 + titleGap;
      const boxH = chunkH;
      
      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, sepY - 2, canvas.width, UNDERGROUND_PAD);
      
      // Gray separator bar
      ctx.fillStyle = '#555';
      ctx.fillRect(0, sepY, canvas.width, 3);
      
      // Title
      ctx.fillStyle = '#ccc';
      ctx.font = 'bold 24px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Underground / Instance fairy rings', 10, sepY + 20);
      
      const allRings = UNDERGROUND_RINGS.map(code => ({ type: 'ring', code, color: '#4a9eff' }));
      // Fairy Resistance Hideout is first box
      const bw = colW - 6;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // === Fairy Resistance Hideout (first box) ===
      {
        const cx = gi.colLefts[0] + gi.colWidths[0] / 2;
        const bx = cx - bw/2;
        const by = topY;
        
        ctx.fillStyle = '#111';
        roundRect(ctx, bx, by, bw, boxH, 6);
        ctx.fill();
        ctx.strokeStyle = '#4a9eff';
        ctx.lineWidth = 2;
        roundRect(ctx, bx, by, bw, boxH, 6);
        ctx.stroke();
        
        // 4 codes stacked vertically with clear down arrows (solid triangles)
        const codes = ['AIR','DLR','DJQ','AJS'];
        // Fit all 4 codes + 3 arrows inside the box by capping font size on BOTH width and height
        const lineFactor = 1.15;     // vertical step per code line
        const arrowSlotFactor = 0.5; // vertical slot reserved per arrow
        const maxFontByHeight = boxH / (codes.length * lineFactor + (codes.length - 1) * arrowSlotFactor);
        const fontSize = Math.max(11, Math.min(bw * 0.22, maxFontByHeight * 0.94));
        ctx.font = `bold ${fontSize}px Arial`;
        const lineH = fontSize * lineFactor;
        const arrowSlot = fontSize * arrowSlotFactor;
        const totalH = codes.length * lineH + (codes.length - 1) * arrowSlot;
        let cy = by + (boxH - totalH) / 2 + lineH / 2;
        
        ctx.fillStyle = '#00e5ff';
        for (let j = 0; j < codes.length; j++) {
          ctx.fillText(codes[j], cx, cy);
          if (j < codes.length - 1) {
            // Solid downward triangle, centered in the slot between two codes
            const triH = fontSize * 0.32;
            const triW = fontSize * 0.52;
            const triY = cy + (lineH + arrowSlot) / 2;
            ctx.fillStyle = '#4a9eff';
            ctx.beginPath();
            ctx.moveTo(cx, triY + triH / 2);
            ctx.lineTo(cx - triW / 2, triY - triH / 2);
            ctx.lineTo(cx + triW / 2, triY - triH / 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#00e5ff';
          }
          cy += lineH + arrowSlot;
        }
      }
      
      // === Underground rings (starting from col 1) ===
      for (let i = 0; i < allRings.length && i + 1 < cols; i++) {
        const item = allRings[i];
        const col = i + 1; // start from column 1
        const cx = gi.colLefts[col] + gi.colWidths[col] / 2;
        const bx = cx - bw/2;
        const by = topY;
        
        ctx.fillStyle = '#111';
        roundRect(ctx, bx, by, bw, boxH, 6);
        ctx.fill();
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 1.5;
        roundRect(ctx, bx, by, bw, boxH, 6);
        ctx.stroke();
        
        const fontSize = Math.max(14, bw * 0.28);
        ctx.fillStyle = '#00e5ff';
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.fillText(item.code, cx, by + boxH * 0.5);
      }
    }
    
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // Fairy ring chunk labels (cyan on black, visible at any zoom)
    const FAIRY_CHUNKS = {
      '4,9':'CIS','4,23':'AJS\nCIP','6,4':'CIR','6,26':'DKS','7,6':'DJR',
      '8,20':'AKQ','8,23':'ALP','8,27':'AJR','9,12':'AKR','9,26':'CJR',
      '10,4':'BLS','10,25':'ALS','10,32':'DKR','10,37':'CKS','10,40':'ALQ',
      '11,38':'BKR','12,26':'BLR','13,6':'AIS','13,25':'BIS','13,37':'BIP',
      '14,25':'DJP','14,26':'AIR','14,32':'CLP','15,32':'DIS','16,18':'DLR',
      '16,23':'CIQ','16,25':'CLS','16,29':'DKP','16,30':'AIQ','16,34':'BIQ',
      '17,9':'AJP','17,17':'BJS','17,21':'BKP','17,37':'DLQ','18,19':'BJP',
      '18,24':'AKS','18,27':'CKR','19,5':'CKQ','22,26':'CLR','22,35':'AKP',
      '26,33':'CJQ'
    };

    function drawFairyRingChunkLabels(ctx, gi) {
      if (!gi || !manifest) return;
      // Game-coord -> chunk conversion, must match placeFairyRingMarker in static/index.js
      const TILE_SIZE = 64;
      const MIN_X = 1024;
      const MAX_Y = 4160;
      const X_CORRECTION = -6;
      const FAIRY_RING_ICON_SHIFT_X = 27; // px, must match placeFairyRingMarker in static/index.js (HD map built-in travel icon alignment)
      // Exception chunk (fully unchanged behavior: centered label, no leader line)
      const EXCEPTION_CHUNKS = new Set(['10,32']);
      // Per-chunk label overrides:
      //  - {dx, dy}: direction from ring to label (close placement)
      //  - {center: true}: label centered in the chunk, but keep the leader line
      //  - {leftCenter: true}: label on the left side of the chunk, vertically centered
      //  - offsetX/offsetY: extra pixel shift after close placement
      const DIRECTION_OVERRIDES = {
        '8,27': { dx: 1, dy: 1 },                // Kurask boss top-right -> label bottom-right of the ring
        '7,6': { center: true },                 // DJR -> centered label + diagonal leader line to the box center
        '15,32': { leftCenter: true, offsetX: 20, offsetY: 25 }, // DIS -> left side, nudged a bit toward bottom-right
        '16,34': { leftCenter: true, offsetX: 45, offsetY: 45 }, // BIQ -> left-middle, nudged toward bottom-right (closer to the ring)
        '17,21': { dx: 1, dy: -1, offsetX: -45 } // BKP -> shift left, clear of the Smoke Devil boss
      };

      for (const [key, codes] of Object.entries(FAIRY_CHUNKS)) {
        const [r, c] = key.split(',').map(Number);
        if (r >= gi.rowTops.length || c >= gi.colLefts.length) continue;
        const chunkX = gi.colLefts[c];
        const chunkY = gi.rowTops[r];
        const chunkW = gi.colWidths[c];
        const chunkH = gi.rowHeights[r];
        const lines = codes.split('\n');
        const fontSize = Math.max(9, Math.min(chunkW, chunkH) * 0.16);
        ctx.font = `bold ${fontSize}px Arial`;

        // Measure text
        const lineHeight = fontSize * 1.2;
        const totalHeight = lines.length * lineHeight;
        let maxWidth = 0;
        for (const line of lines) {
          const m = ctx.measureText(line);
          if (m.width > maxWidth) maxWidth = m.width;
        }
        const padX = fontSize * 0.3;
        const padY = fontSize * 0.15;
        const boxW = maxWidth + padX * 2;
        const boxH = totalHeight + padY * 2;

        // Default: centered box (used for the exception chunk)
        let boxX = chunkX + (chunkW - boxW) / 2;
        let boxY = chunkY + (chunkH - boxH) / 2;

        // Icon anchor = average position of the fairy ring(s) in this chunk (pixel coords)
        let anchorX = 0, anchorY = 0, anchorCount = 0;
        for (const code of lines) {
          const loc = FAIRY_RING_LOCATIONS[code];
          if (!loc || loc.x === undefined) continue;
          const chunkGameX = MIN_X + c * TILE_SIZE;
          const chunkGameY = MAX_Y - r * TILE_SIZE;
          const fracX = (loc.x + X_CORRECTION - chunkGameX) / TILE_SIZE;
          const fracY = (chunkGameY - loc.y) / TILE_SIZE;
          anchorX += chunkX + fracX * chunkW;
          anchorY += chunkY + fracY * chunkH;
          anchorCount++;
        }

        const isException = EXCEPTION_CHUNKS.has(key);
        if (!isException && anchorCount > 0) {
          // Direction decision uses the UNSHIFTED ring position (unchanged behavior);
          // the leader line + label box follow the shifted icon (matching placeFairyRingMarker).
          const rawIconX = anchorX / anchorCount;
          const rawIconY = anchorY / anchorCount;
          const fracX = (rawIconX - chunkX) / chunkW;
          const fracY = (rawIconY - chunkY) / chunkH;
          const iconX = rawIconX + FAIRY_RING_ICON_SHIFT_X;
          const iconY = rawIconY;
          const iconSize = Math.min(chunkW, chunkH) * 0.135; // matches placeFairyRingMarker

          const pad = Math.max(6, fontSize * 0.2);
          const override = DIRECTION_OVERRIDES[key];
          if (override && override.center) {
            // Label centered in the chunk (the leader line is still drawn below)
            boxX = chunkX + (chunkW - boxW) / 2;
            boxY = chunkY + (chunkH - boxH) / 2;
            boxX += (override.offsetX || 0);
            boxY += (override.offsetY || 0);
          } else if (override && override.leftCenter) {
            // Label on the left side of the chunk, vertically centered
            boxX = chunkX + pad;
            boxY = chunkY + (chunkH - boxH) / 2;
            boxX += (override.offsetX || 0);
            boxY += (override.offsetY || 0);
          } else {
            // Direction from the ring toward the label (opposite side, but close to the ring).
            let dx, dy;
            if (override) {
              dx = override.dx; dy = override.dy;
            } else {
              const centerLo = 0.42, centerHi = 0.58;
              if (fracX >= centerLo && fracX <= centerHi && fracY >= centerLo && fracY <= centerHi) {
                dx = 0; dy = 1; // ring in the middle -> label below it
              } else {
                dx = fracX < 0.5 ? 1 : -1;
                dy = fracY < 0.5 ? 1 : -1;
              }
            }

            // Place the box right next to the ring (NOT in the far corner of the chunk)
            const gap = 10;
            if (dx > 0) boxX = iconX + iconSize / 2 + gap;
            else if (dx < 0) boxX = iconX - iconSize / 2 - gap - boxW;
            else boxX = iconX - boxW / 2;
            if (dy > 0) boxY = iconY + iconSize / 2 + gap;
            else if (dy < 0) boxY = iconY - iconSize / 2 - gap - boxH;
            else boxY = iconY - boxH / 2;

            // Optional per-chunk fine-tuning
            if (override) {
              boxX += (override.offsetX || 0);
              boxY += (override.offsetY || 0);
            }

            // Keep the box inside the chunk
            boxX = Math.max(chunkX + pad, Math.min(chunkX + chunkW - boxW - pad, boxX));
            boxY = Math.max(chunkY + pad, Math.min(chunkY + chunkH - boxH - pad, boxY));
          }

          // Thick black leader line from the icon to the label box (drawn under the box)
          const inside = iconX >= boxX && iconX <= boxX + boxW && iconY >= boxY && iconY <= boxY + boxH;
          if (!inside) {
            // Centered labels (center branch) aim at the box CENTER so the line runs diagonal
            // to the ring (e.g. DJR in chunk 7,6); otherwise aim at the nearest box edge.
            const lineX = (override && override.center)
              ? boxX + boxW / 2
              : Math.max(boxX, Math.min(iconX, boxX + boxW));
            const lineY = (override && override.center)
              ? boxY + boxH / 2
              : Math.max(boxY, Math.min(iconY, boxY + boxH));
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(iconX, iconY);
            ctx.lineTo(lineX, lineY);
            ctx.stroke();
          }
        }

        // Black background box
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        const radius = Math.min(boxW, boxH) * 0.15;
        ctx.beginPath();
        ctx.moveTo(boxX + radius, boxY);
        ctx.lineTo(boxX + boxW - radius, boxY);
        ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
        ctx.lineTo(boxX + boxW, boxY + boxH - radius);
        ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
        ctx.lineTo(boxX + radius, boxY + boxH);
        ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
        ctx.lineTo(boxX, boxY + radius);
        ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
        ctx.fill();

        // Cyan text
        ctx.fillStyle = '#00e5ff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textCX = boxX + boxW / 2;
        const textCY = boxY + boxH / 2;
        for (let i = 0; i < lines.length; i++) {
          const textY = textCY + (i - (lines.length - 1) / 2) * lineHeight;
          ctx.fillText(lines[i], textCX, textY);
        }
      }
    }

    function zoom(factor) {
      const rect = fullMap.getBoundingClientRect();
      const cx = rect.width / 2, cy = rect.height / 2;
      const natX = (cx - currentTX) / currentScale;
      const natY = (cy - currentTY) / currentScale;
      let newScale = currentScale * factor;
      newScale = Math.max(minScale, Math.min(maxScale, newScale));
      currentTX = cx - natX * newScale;
      currentTY = cy - natY * newScale;
      currentScale = newScale;
      applyTransform();
    }

    document.getElementById('zoomInBtn').addEventListener('click', () => zoom(1.2));
    document.getElementById('zoomOutBtn').addEventListener('click', () => zoom(1 / 1.2));

    // Identify button - toggles chunk ID overlay
    let identifyMode = false;
    const identifyBtn = document.getElementById('identifyBtn');
    identifyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      identifyMode = !identifyMode;
      identifyBtn.style.color = identifyMode ? '#fff' : '#888';
      identifyBtn.style.background = identifyMode ? 'rgba(74,158,255,0.5)' : 'rgba(30,30,30,0.85)';
      drawChunkIds();
    });

    function drawChunkIds() {
      const ctx = canvas.getContext('2d');
      drawGrid(); // redraw grid first
      if (!identifyMode || !manifest || !window._gridInfo) return;
      const gi = window._gridInfo;
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let r = 0; r < manifest.rows; r++) {
        for (let c = 0; c < manifest.cols; c++) {
          const cx = gi.colLefts[c] + gi.colWidths[c] / 2;
          const cy = gi.rowTops[r] + gi.rowHeights[r] / 2;
          const fontSize = Math.max(8, Math.min(gi.colWidths[c], gi.rowHeights[r]) * 0.18);
          ctx.font = `bold ${fontSize}px Arial`;
          ctx.fillText(`${r},${c}`, cx, cy);
        }
      }
    }

    fullMap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      const rect = fullMap.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const natX = (mx - currentTX) / currentScale;
      const natY = (my - currentTY) / currentScale;
      let newScale = currentScale * factor;
      newScale = Math.max(minScale, Math.min(maxScale, newScale));
      currentTX = mx - natX * newScale;
      currentTY = my - natY * newScale;
      currentScale = newScale;
      applyTransform();
    }, { passive: false });

    let isPanning = false, panStartX, panStartY, panStartTX, panStartTY;
    let panTimer = null; // throttle transform updates to ~60 fps
    fullMap.addEventListener('mousedown', (e) => {
      if (e.target.closest && e.target.closest('#zoomControls')) return;
      if (e.button !== 0) return; // only left mouse button pans; right-click drag is disabled
      e.preventDefault();
      isPanning = true; panStartX = e.clientX; panStartY = e.clientY;
      panStartTX = currentTX; panStartTY = currentTY;
      fullMap.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      currentTX = panStartTX + (e.clientX - panStartX);
      currentTY = panStartTY + (e.clientY - panStartY);
      if (panTimer !== null) return; // at most one transform update per ~16ms
      panTimer = setTimeout(() => {
        panTimer = null;
        applyTransform();
      }, 16);
    });
    window.addEventListener('mouseup', () => {
      if (isPanning) applyTransform(); // snap to final position on release
      isPanning = false;
      fullMap.style.cursor = '';
      if (panTimer !== null) { clearTimeout(panTimer); panTimer = null; }
    });

    // === Underground / instance fairy rings popup ===
    const undergroundBtn = document.getElementById('undergroundBtn');
    const undergroundPopup = document.getElementById('undergroundPopup');
    const undergroundPopupClose = document.getElementById('undergroundPopupClose');
    const undergroundPopupGrid = document.getElementById('undergroundPopupGrid');

    // Location names for the underground / instance rings (from the OSRS Wiki)
    const UNDERGROUND_LOCATIONS = {
      'ALR': 'Abyssal area',
      'BKS': 'Zanaris',
      'BLP': 'TzHaar area',
      'DIP': 'Abyssal Nexus',
      'DLP': 'Grimstone',
      'AJQ': 'Dorgesh-Kaan',
      'BJR': 'Realm of the Fisher King',
      'BKQ': 'Enchanted Valley',
      'CKP': "Cosmic entity's plane",
      'DIQ': 'Player owned house',
      'DIR': "Gorak's Plane",
      'DLS': 'Myreque hideout',
      'BLQ': "Yu'biusk"
    };

    function makeUndergroundCard(code, location, imageFile, extraCodes) {
      const card = document.createElement('div');
      // Square tile filled with the location's map image (from the wiki)
      card.style.cssText = 'position:relative; aspect-ratio:1/1; box-sizing:border-box; border:2px solid #4a9eff; border-radius:10px; overflow:hidden; background:#0a0a12 url(static/underground/' + imageFile + '.png) center/cover no-repeat;';

      // Location text line attached to the top of the tile

      card.appendChild(loc);

      // Fairy ring code(s) in a small black rectangle at the center (like the map chunks)

      const codes = extraCodes || [code];
      for (const c of codes) {

        badge.style.cssText = 'background:rgba(0,0,0,0.88); border:1px solid rgba(0,229,255,0.55); border-radius:4px; color:#00e5ff; font-weight:bold; font-size:15px; font-family:Arial,sans-serif; letter-spacing:2px; padding:1px 9px; display:flex; align-items:center; justify-content:center; width:60px; box-sizing:border-box;';
        wrap.appendChild(badge);
      }
      card.appendChild(wrap);
      return card;
    }

    function buildUndergroundPopup() {
      undergroundPopupGrid.innerHTML = '';
      // 1. Fairy Resistance Hideout (sequence: AIR -> DLR -> DJQ -> AJS)
      undergroundPopupGrid.appendChild(makeUndergroundCard('', 'Fairy Resistance Hideout', 'HIDEOUT', ['AIR', 'DLR', 'DJQ', 'AJS']));
      // 2. All other underground rings

    undergroundBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      undergroundPopup.style.display = 'flex';

    undergroundPopupClose.addEventListener('click', () => { undergroundPopup.style.display = 'none'; });
    undergroundPopup.addEventListener('click', (e) => {
      if (e.target === undergroundPopup) undergroundPopup.style.display = 'none';
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') undergroundPopup.style.display = 'none';
    });

    // === Fairy ring tier list (Rank fairy rings) popup ===
    const RANK_STORAGE_KEY = 'fairyspecial.rankings.v1';
    const RANK_TIERS = ['S', 'A', 'B', 'C', 'D', 'E', 'F'];

    const rankBtn = document.getElementById('rankBtn');
    const rankPopup = document.getElementById('rankPopup');
    const rankPopupClose = document.getElementById('rankPopupClose');
    const rankTierList = document.getElementById('rankTierList');

    // Manual per-chunk positioning (workaround for the normal-map chunk alignment).
    // The surface tiles AND the align popup now use the FULL HD stitched map
    // (static/map_stitched.png, MAP_W x MAP_H) as the background, so the map is
    // CONTINUOUS: panning past a chunk edge shows the neighbouring chunks instead
    // of black. State per ring = { mapX, mapY, viewW }: (mapX, mapY) is the
    // stitched-map pixel at the centre of the view, viewW = how many stitched
    // pixels the view shows across (256 = about one chunk).
    const ALIGN_OFFSETS_KEY = 'fairyspecial.rankings.offsets.v1';
    const MAP_W = 11776;
    const MAP_H = 7936;
    const VIEW_DEFAULT = 256;     // ~one chunk across
    const VIEW_MIN = 32;
    const VIEW_MAX = 4096;
    const VIEW_STEP = 1.15;       // wheel step
    const VIEW_BUTTON_STEP = 1.5; // + / - button step
    // Calibrated chunk geometry (matches setupCanvas): colLefts[c]=245.3504*c+245, rowTops[r]=233.6*r+231.
    const CAL_COL_W = 245.3504;
    const CAL_ROW_H = 233.6;
    const CAL_NX = 245;
    const CAL_NY = 231;
    let alignOffsets = loadAlignOffsets();
    let rankItemsByCode = {};

    function loadAlignOffsets() {
      try { return JSON.parse(localStorage.getItem(ALIGN_OFFSETS_KEY)) || {}; } catch (e) { return {}; }
    }
    function saveAlignOffsets() {
      try { localStorage.setItem(ALIGN_OFFSETS_KEY, JSON.stringify(alignOffsets)); } catch (e) {}
    }
    function parseChunkRowCol(chunkId) {
      const p = String(chunkId).split('_');
      return { row: parseInt(p[1], 10), col: parseInt(p[2], 10) };
    }
    // Keep the view inside the map so it always shows real map content.
    function clampAlignView(mapX, mapY, viewW) {
      const mx = Math.max(viewW / 2, Math.min(MAP_W - viewW / 2, mapX));
      const my = Math.max(viewW / 2, Math.min(MAP_H - viewW / 2, mapY));
      return [mx, my];
    }
    // Default / saved / legacy state for a surface ring -> { mapX, mapY, viewW }.
    function normalizeAlignState(item, off) {
      const rc = item ? parseChunkRowCol(item.chunkId) : null;
      const chunkX = rc ? CAL_COL_W * rc.col + CAL_NX : MAP_W / 2;
      const chunkY = rc ? CAL_ROW_H * rc.row + CAL_NY : MAP_H / 2;
      if (off && off.mapX !== undefined) {
        return { mapX: off.mapX, mapY: off.mapY, viewW: off.viewW || VIEW_DEFAULT };
      }
      if (off && off.zoom) { // legacy {zoom, cx, cy} chunk-fraction format
        const cx = off.cx !== undefined ? off.cx : 0.5;
        const cy = off.cy !== undefined ? off.cy : 0.5;
        return { mapX: chunkX + cx * CAL_COL_W, mapY: chunkY + cy * CAL_ROW_H, viewW: VIEW_DEFAULT / Math.max(off.zoom, 0.1) };
      }
      return { mapX: chunkX + CAL_COL_W / 2, mapY: chunkY + CAL_ROW_H / 2, viewW: VIEW_DEFAULT };
    }

    // Background CSS using the full stitched map. Resolution independent: the
    // position/size percentages are relative to the (square) tile/viewport.
    function stitchedBgCss(mapX, mapY, viewW) {
      const Px = Math.round(100 * (0.5 * viewW - mapX) / (viewW - MAP_W) * 100) / 100;
      const Py = Math.round(100 * (0.5 * viewW - mapY) / (viewW - MAP_H) * 100) / 100;
      const sx = Math.round(MAP_W / viewW * 10000) / 100;
      const sy = Math.round(MAP_H / viewW * 10000) / 100;
      return '#0a0a12 url(static/map_stitched.png) ' + Px + '% ' + Py + '% / ' + sx + '% ' + sy + '% no-repeat';
    }

    function rankTileBackground(item) {
      if (item.kind !== 'surface') return '#0a0a12 url(' + item.img + ') center/cover no-repeat';
      const s = normalizeAlignState(item, alignOffsets[item.code]);
      return stitchedBgCss(s.mapX, s.mapY, s.viewW);
    }

    // Every rankable fairy ring. Surface rings use their chunk image;
    // underground/instance rings use the existing underground image.
    function buildRankItems() {
      const items = [];
      for (const [code, cfg] of Object.entries(FAIRY_RING_LOCATIONS)) {
        items.push({ code, name: cfg.dest || code, img: 'static/chunks/' + cfg.chunkId + '.png', kind: 'surface', chunkId: cfg.chunkId });
      }
      for (const code of UNDERGROUND_RINGS) {
        items.push({ code, name: UNDERGROUND_LOCATIONS[code] || code, img: 'static/underground/' + code + '.png', kind: 'underground' });
      }
      // Fairy Resistance Hideout (reached via AIR -> DLR -> DJQ -> AJS)
      items.push({ code: 'HIDEOUT', name: 'Fairy Resistance Hideout (AIR -> DLR -> DJQ -> AJS)', img: 'static/underground/HIDEOUT.png', kind: 'underground' });
      items.sort((a, b) => a.code.localeCompare(b.code));
      return items;
    }

    function makeRankTile(item) {
      const tile = document.createElement('div');
      tile.className = 'rank-tile';
      tile.dataset.code = item.code;
      tile.draggable = true;
      tile.title = item.code + (item.name && item.name !== item.code ? ' - ' + item.name : '');
      tile.style.background = rankTileBackground(item);
      const badge = document.createElement('div');
      badge.className = 'rank-tile-badge';
      badge.textContent = item.code;
      // Normal-map chunks: clicking the code badge opens the manual positioning popup.
      if (item.kind === 'surface') {
        badge.classList.add('clickable');
        badge.title = 'Click to position';
        badge.addEventListener('click', (e) => {
          e.stopPropagation();

      tile.appendChild(badge);
      tile.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', item.code);
        e.dataTransfer.effectAllowed = 'move';

      tile.addEventListener('dragend', () => tile.classList.remove('dragging'));
      return tile;
    }

    function setupRankZone(zone) {
      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      });
      zone.addEventListener('dragleave', (e) => {
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over');
      });
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const code = e.dataTransfer.getData('text/plain');
        const tile = rankTierList.querySelector('.rank-tile[data-code="' + code + '"]');
        if (!tile) return;
        // Insert at the drop position so rings can be ordered within a tier
        const others = [...zone.querySelectorAll('.rank-tile')].filter(t => t !== tile);
        let insertBefore = null;
        for (const t of others) {
          const r = t.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          if (e.clientY < cy || (e.clientY >= r.top && e.clientY <= r.bottom && e.clientX < cx)) {
            insertBefore = t;
            break;
          }
        }
        if (insertBefore) zone.insertBefore(tile, insertBefore);
        else zone.appendChild(tile);
        saveRankings();
      });
    }

    function saveRankings() {
      const data = { tiers: {}, pool: [] };
      for (const tier of RANK_TIERS) {
        const zone = rankTierList.querySelector('.rank-tier[data-tier="' + tier + '"] .rank-tier-zone');
        data.tiers[tier] = [...zone.querySelectorAll('.rank-tile')].map(t => t.dataset.code);
      }
      data.pool = [...rankTierList.querySelectorAll('#rankPool .rank-tile')].map(t => t.dataset.code);
      try { localStorage.setItem(RANK_STORAGE_KEY, JSON.stringify(data)); } catch (err) {}
    }

    // Move every ring back to the pool, sorted alphabetically by code, and save.
    function resetRankings() {
      const poolZone = document.getElementById('rankPool');
      if (!poolZone) return;
      // Grab references to ALL tiles first (clearing the pool would destroy them).
      const tiles = [...rankTierList.querySelectorAll('.rank-tile')];
      tiles.sort((a, b) => a.dataset.code.localeCompare(b.dataset.code));
      poolZone.innerHTML = '';
      for (const tile of tiles) poolZone.appendChild(tile);
      saveRankings();
    }

    function loadRankings() {
      try {
        const data = JSON.parse(localStorage.getItem(RANK_STORAGE_KEY));
        if (data && data.tiers) return data;
      } catch (err) {}
      return null;
    }

    function buildRankPopup() {
      rankTierList.innerHTML = '';
      const items = buildRankItems();
      rankItemsByCode = {};
      const tileByCode = {};
      for (const item of items) { rankItemsByCode[item.code] = item; tileByCode[item.code] = makeRankTile(item); }

      // Tier rows S..E
      const zones = {};
      for (const tier of RANK_TIERS) {
        const row = document.createElement('div');
        row.className = 'rank-tier';
        row.dataset.tier = tier;
        const label = document.createElement('div');
        label.className = 'rank-tier-label';
        label.textContent = tier;
        const zone = document.createElement('div');
        zone.className = 'rank-tier-zone';
        row.appendChild(label);
        row.appendChild(zone);
        rankTierList.appendChild(row);
        zones[tier] = zone;
        setupRankZone(zone);
      }

      // Unranked pool row
      const poolRow = document.createElement('div');
      poolRow.className = 'rank-tier rank-pool';
      const poolLabel = document.createElement('div');
      poolLabel.className = 'rank-tier-label';
      poolLabel.textContent = '-';
      const poolZone = document.createElement('div');
      poolZone.className = 'rank-tier-zone';
      poolZone.id = 'rankPool';
      poolRow.appendChild(poolLabel);
      poolRow.appendChild(poolZone);
      rankTierList.appendChild(poolRow);
      setupRankZone(poolZone);

      // Restore saved layout, or leave everything in the pool
      const saved = loadRankings();
      const placed = new Set();
      if (saved) {
        for (const tier of RANK_TIERS) {
          for (const code of (saved.tiers[tier] || [])) {
            if (tileByCode[code]) { zones[tier].appendChild(tileByCode[code]); placed.add(code); }
          }
        }
        for (const code of (saved.pool || [])) {
          if (tileByCode[code]) { poolZone.appendChild(tileByCode[code]); placed.add(code); }
        }
      }
      for (const item of items) {
        if (!placed.has(item.code)) poolZone.appendChild(tileByCode[item.code]);
      }
    }

    rankBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      buildRankPopup();
      rankPopup.style.display = 'flex';
    });
    const rankResetBtn = document.getElementById('rankResetBtn');
    const rankResetConfirm = document.getElementById('rankResetConfirm');
    const rankResetConfirmYes = document.getElementById('rankResetConfirmYes');
    const rankResetConfirmNo = document.getElementById('rankResetConfirmNo');
    rankResetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      rankResetConfirm.style.display = 'flex';
    });
    rankResetConfirmYes.addEventListener('click', (e) => {
      e.stopPropagation();
      rankResetConfirm.style.display = 'none';
      resetRankings();
    });
    rankResetConfirmNo.addEventListener('click', (e) => {
      e.stopPropagation();
      rankResetConfirm.style.display = 'none';
    });
    rankResetConfirm.addEventListener('click', (e) => {
      if (e.target === rankResetConfirm) rankResetConfirm.style.display = 'none';
    });
    rankPopupClose.addEventListener('click', () => { rankPopup.style.display = 'none'; });
    rankPopup.addEventListener('click', (e) => {
      if (e.target === rankPopup) rankPopup.style.display = 'none';
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') rankPopup.style.display = 'none';
    });

    // === Manual positioning popup (normal-map fairy ring chunks) ===
    const alignPopup = document.getElementById('alignPopup');
    const alignPopupClose = document.getElementById('alignPopupClose');
    const alignViewport = document.getElementById('alignViewport');
    const alignPopupTitle = document.getElementById('alignPopupTitle');
    const alignZoomInBtn = document.getElementById('alignZoomInBtn');
    const alignZoomOutBtn = document.getElementById('alignZoomOutBtn');
    const alignZoomLabel = document.getElementById('alignZoomLabel');
    const alignCenterBtn = document.getElementById('alignCenterBtn');
    let alignCode = null;
    let alignState = { mapX: MAP_W / 2, mapY: MAP_H / 2, viewW: VIEW_DEFAULT };
    let alignDirty = false;
    let alignDragging = false, alignStartX = 0, alignStartY = 0, alignStartMapX = 0, alignStartMapY = 0;

    function renderAlignViewport() {
      alignViewport.style.background = stitchedBgCss(alignState.mapX, alignState.mapY, alignState.viewW);
    }
    function updateAlignZoomLabel() {
      alignZoomLabel.textContent = Math.round(VIEW_DEFAULT / alignState.viewW * 100) + '%';
    }
    // Centre the fairy ring in the view, keeping ~one chunk of continuous map around it.
    function centerAlignOnRing() {
      const item = rankItemsByCode[alignCode];
      const loc = item && FAIRY_RING_LOCATIONS[item.code];
      if (!loc || loc.x === undefined) return;
      const TILE_SIZE = 64, MIN_X = 1024, MAX_Y = 4160, X_CORRECTION = -6;
      const rc = parseChunkRowCol(loc.chunkId);
      const chunkGameX = MIN_X + rc.col * TILE_SIZE;
      const chunkGameY = MAX_Y - rc.row * TILE_SIZE;
      const cx = (loc.x + X_CORRECTION - chunkGameX) / TILE_SIZE;
      const cy = (chunkGameY - loc.y) / TILE_SIZE;
      const mapX = CAL_COL_W * rc.col + CAL_NX + cx * CAL_COL_W;
      const mapY = CAL_ROW_H * rc.row + CAL_NY + cy * CAL_ROW_H;
      alignState.viewW = VIEW_DEFAULT;
      [alignState.mapX, alignState.mapY] = clampAlignView(mapX, mapY, alignState.viewW);
      alignDirty = true;
      renderAlignViewport();
      updateAlignZoomLabel();
    }
    // Zoom by `factor` keeping the stitched-map point under (focusX, focusY) fixed.
    function applyAlignViewZoom(factor, focusX, focusY) {
      if (focusX === undefined) { focusX = 0.5; focusY = 0.5; }
      const imgX = alignState.mapX + (focusX - 0.5) * alignState.viewW;
      const imgY = alignState.mapY + (focusY - 0.5) * alignState.viewW;
      alignState.viewW = Math.max(VIEW_MIN, Math.min(VIEW_MAX, alignState.viewW / factor));
      alignState.mapX = imgX - (focusX - 0.5) * alignState.viewW;
      alignState.mapY = imgY - (focusY - 0.5) * alignState.viewW;
      [alignState.mapX, alignState.mapY] = clampAlignView(alignState.mapX, alignState.mapY, alignState.viewW);
      alignDirty = true;
      renderAlignViewport();
      updateAlignZoomLabel();
    }

    function openAlignPopup(code, img, name) {
      alignCode = code;
      const s = normalizeAlignState(rankItemsByCode[code], alignOffsets[code]);
      alignState = { mapX: s.mapX, mapY: s.mapY, viewW: s.viewW };
      [alignState.mapX, alignState.mapY] = clampAlignView(alignState.mapX, alignState.mapY, alignState.viewW);
      alignDirty = false;
      alignPopupTitle.textContent = 'Position ' + code + (name && name !== code ? ' - ' + name : '');
      renderAlignViewport();
      updateAlignZoomLabel();
      alignViewport.style.cursor = 'grab';
      alignPopup.style.display = 'flex';
    }

    function closeAlignPopup() {
      // Only save when the user actually zoomed or panned.
      if (alignCode && alignDirty) {
        alignOffsets[alignCode] = { mapX: alignState.mapX, mapY: alignState.mapY, viewW: alignState.viewW };
        saveAlignOffsets();
        // Apply the new position to the tile in the tier list
        const item = rankItemsByCode[alignCode];
        const tile = rankTierList.querySelector('.rank-tile[data-code="' + alignCode + '"]');
        if (tile && item) tile.style.background = rankTileBackground(item);
      }
      alignCode = null;
      alignPopup.style.display = 'none';
    }

    alignViewport.addEventListener('mousedown', (e) => {
      alignDragging = true;
      alignStartX = e.clientX; alignStartY = e.clientY;
      alignStartMapX = alignState.mapX; alignStartMapY = alignState.mapY;
      alignViewport.style.cursor = 'grabbing';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!alignDragging) return;
      const rect = alignViewport.getBoundingClientRect();
      const scale = alignState.viewW / rect.width; // stitched px per displayed px
      alignState.mapX = alignStartMapX - (e.clientX - alignStartX) * scale;
      alignState.mapY = alignStartMapY - (e.clientY - alignStartY) * scale;
      [alignState.mapX, alignState.mapY] = clampAlignView(alignState.mapX, alignState.mapY, alignState.viewW);
      alignDirty = true;
      renderAlignViewport();
    });
    window.addEventListener('mouseup', () => {
      if (alignDragging) { alignDragging = false; alignViewport.style.cursor = 'grab'; }
    });
    // Scroll zooms AROUND THE CURSOR (point at the island and zoom in).
    alignViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = alignViewport.getBoundingClientRect();
      const fx = (e.clientX - rect.left) / rect.width;
      const fy = (e.clientY - rect.top) / rect.height;
      applyAlignViewZoom(e.deltaY < 0 ? VIEW_STEP : 1 / VIEW_STEP, fx, fy);
    }, { passive: false });
    alignZoomInBtn.addEventListener('click', () => applyAlignViewZoom(VIEW_BUTTON_STEP));
    alignZoomOutBtn.addEventListener('click', () => applyAlignViewZoom(1 / VIEW_BUTTON_STEP));
    alignCenterBtn.addEventListener('click', () => centerAlignOnRing());
    alignPopupClose.addEventListener('click', () => closeAlignPopup());
    alignPopup.addEventListener('click', (e) => { if (e.target === alignPopup) closeAlignPopup(); });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeAlignPopup();
    });

    async function initMap() {
      try {
        const resp = await fetch('static/chunks/manifest.json');
        manifest = await resp.json();
      } catch(e) { console.error('Failed to load manifest', e); return; }

      if (!stitched.complete) await new Promise(r => stitched.addEventListener('load', r));
      setupCanvas();
      drawChunkIds();

      const rect = fullMap.getBoundingClientRect();
      const gi = window._gridInfo;
      if (gi) {
        // Startup zoom: fit a ~START_SPAN_COLS x START_SPAN_ROWS chunk band into the viewport,
        // centered on chunk (DEFAULT_CENTER_ROW, DEFAULT_CENTER_COL) so the map starts zoomed in
        // at the level shown in the pasted screenshot instead of showing the whole map.
        const colW = gi.colWidths[DEFAULT_CENTER_COL] || baseTileW;
        const rowH = gi.rowHeights[DEFAULT_CENTER_ROW] || baseTileH;
        currentScale = Math.min(rect.width / (START_SPAN_COLS * colW), rect.height / (START_SPAN_ROWS * rowH));
        currentScale = Math.max(minScale, Math.min(maxScale, currentScale));
        const cx = gi.colLefts[DEFAULT_CENTER_COL] + gi.colWidths[DEFAULT_CENTER_COL] / 2;
        const cy = gi.rowTops[DEFAULT_CENTER_ROW] + gi.rowHeights[DEFAULT_CENTER_ROW] / 2;
        currentTX = rect.width / 2 - cx * currentScale;
        currentTY = rect.height / 2 - cy * currentScale;
      } else {
        currentScale = Math.min(rect.width / stitched.naturalWidth, rect.height / stitched.naturalHeight, 1);
      }
      applyTransform();

      try {
        if (window.BossPickerAPI && typeof window.BossPickerAPI.init === 'function') {
          await window.BossPickerAPI.init(manifest, stitchedWrap, canvas, fullMap, false);
        }
      } catch(e) { console.warn('BossPickerAPI init failed', e); }
    }

    initMap();
  </script>
</body>
</html>
